<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabeçalho - Netflix Style</title>
    <link rel="stylesheet" href="style.css">
</head>

<body background="img/fundo.jpg">

    <header class="header">

        <div class="logo">
            <img src="img/logo.png" alt="Netflix Logo">
        </div>

        <nav class="nav-menu">

            <div class="language-select">
                <select id="language">
                    <option value="pt">Português</option>
                    <option value="en">English</option>
                </select>
            </div>

           <a href="filmes.html" class="btn-primary">Entrar</a>

        </nav>

    </header>

    <main>

        <section class="principal">

            <h1>Diversão ilimitada a partir de R$ 20,90/mês</h1>

            <p>Novidades semanais. Cancele quando quiser.</p>

            <h2>Quer assistir?</h2>

            <p>Informe seu email para criar ou reiniciar sua assinatura.</p>

            <input type="email" placeholder="Email">

            <button>VAMOS LÁ</button>

        </section>

    </main>

</body>

</html>
